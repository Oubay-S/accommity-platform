services:
  # ── Backend Laravel API ──
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: accommity-backend
    restart: unless-stopped
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
      - backend-vendor:/var/www/backend/vendor
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: accommity_db
      DB_USERNAME: accommity_user
      DB_PASSWORD: accommity_password
      APP_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:4200
      SANCTUM_STATEFUL_DOMAINS: localhost:4200
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      RUN_MIGRATIONS: "true"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    networks:
      - accommity-network

  # ── Frontend Angular SPA ──
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: accommity-frontend
    restart: unless-stopped
    ports:
      - "4200:4200"
    environment:
      # Le proxy /api du dev-server vise nginx (127.0.0.1 = ce conteneur)
      API_PROXY_TARGET: http://nginx
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      nginx:
        condition: service_started
    networks:
      - accommity-network

  # ── Nginx Web Server (Reverse Proxy) ──
  nginx:
    image: nginx:alpine
    container_name: accommity-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/backend
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - accommity-network

  # ── PostgreSQL Database ──
  postgres:
    image: postgres:16-alpine
    container_name: accommity-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: accommity_db
      POSTGRES_USER: accommity_user
      POSTGRES_PASSWORD: accommity_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accommity_user -d accommity_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - accommity-network

  # ── Mailpit (capture des emails en développement) ──
  mailpit:
    image: axllent/mailpit:latest
    container_name: accommity-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - accommity-network

networks:
  accommity-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  backend-vendor:
    driver: local
  frontend-node-modules:
    driver: local

version: '3.8'

services:
  # ── Backend Laravel API ──
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: accommity-backend
    restart: unless-stopped
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: accommity_db
      DB_USERNAME: accommity_user
      DB_PASSWORD: accommity_password
    depends_on:
      - postgres
    networks:
      - accommity-network

  # ── Frontend Angular SPA ──
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: accommity-frontend
    restart: unless-stopped
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - accommity-network

  # ── Nginx Web Server (Reverse Proxy) ──
  nginx:
    image: nginx:alpine
    container_name: accommity-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/backend
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - accommity-network

  # ── PostgreSQL Database ──
  postgres:
    image: postgres:16-alpine
    container_name: accommity-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: accommity_db
      POSTGRES_USER: accommity_user
      POSTGRES_PASSWORD: accommity_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - accommity-network

  # ── pgAdmin (PostgreSQL Web UI) ──
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: accommity-pgadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@accommity.ma
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - postgres
    networks:
      - accommity-network

networks:
  accommity-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local

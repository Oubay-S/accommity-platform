name: Docker Build

on:
  push:
    branches: [ main ]
    paths:
      - 'docker/**'
      - 'docker-compose*.yml'
      - 'deploy/**'
      - 'scripts/**'
      - '.dockerignore'
      - '.github/workflows/docker-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'docker/**'
      - 'docker-compose*.yml'
      - 'deploy/**'
      - 'scripts/**'
      - '.dockerignore'
      - '.github/workflows/docker-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Compose Files
        run: |
          docker compose -f docker-compose.yml config -q
          cp deploy/.env.example deploy/.env
          docker compose -f docker-compose.deploy.yml --env-file deploy/.env config -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend (dev)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/backend.Dockerfile
          push: false
          load: false
          cache-from: type=gha,scope=backend-dev
          cache-to: type=gha,mode=max,scope=backend-dev

      - name: Build frontend (dev)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/frontend.Dockerfile
          push: false
          load: false
          cache-from: type=gha,scope=frontend-dev
          cache-to: type=gha,mode=max,scope=frontend-dev

      - name: Build backend (deploy)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/backend.prod.Dockerfile
          push: false
          load: false
          cache-from: type=gha,scope=backend-prod
          cache-to: type=gha,mode=max,scope=backend-prod

      - name: Build frontend (deploy)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/frontend.prod.Dockerfile
          push: false
          load: false
          cache-from: type=gha,scope=frontend-prod
          cache-to: type=gha,mode=max,scope=frontend-prod

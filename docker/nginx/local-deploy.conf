server {
    listen 80;
    server_name localhost;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Les photos d'annonces sont limitées à 5 Mo côté Laravel.
    client_max_body_size 6m;

    # API Laravel : tout /api est traité par le front controller.
    location ^~ /api {
        include fastcgi_params;
        fastcgi_pass backend:9000;
        fastcgi_read_timeout 120s;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/backend/public;
        fastcgi_param HTTP_PROXY "";
    }

    # Photos uploadées (volume partagé avec le backend).
    location ^~ /storage/ {
        alias /var/www/backend/storage/app/public/;
        try_files $uri =404;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Assets Angular hashés.
    location ~* \.(?:css|js|jpg|jpeg|png|webp|gif|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA : toutes les routes inconnues retombent sur index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

; Configuration PHP commune aux environnements Docker Accommity.
; Les limites couvrent l'upload de photos d'annonces (5 Mo côté Laravel).
upload_max_filesize = 6M
post_max_size = 12M
memory_limit = 256M
max_execution_time = 120
max_input_vars = 3000

date.timezone = Africa/Casablanca

; En local, les fichiers sont montés depuis l'hôte : on veut voir les changements.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
